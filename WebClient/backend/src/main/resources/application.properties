# ── API web ────────────────────────────────────────────────────────────────
# Escucha en todas las interfaces para que las tablets/celulares de la red local puedan entrar.
server.port=8080
server.address=0.0.0.0

# ── Servidor RMI (debe coincidir con config.properties del ServerRestaurante) ──
# rmi.host  = SERVER_IP    (la IP de LAN del equipo que corre el servidor, NO localhost si está en otro PC)
# rmi.port  = SERVER_PORT
# rmi.name  = SERVER_NAME  (nombre base; el servidor publica <name>, <name>-productos, <name>-mesas, ...)
# También se pueden definir con variables de entorno: RMI_HOST, RMI_PORT, RMI_NAME
rmi.host=localhost
rmi.port=1808
rmi.name=Uwu

# ── Frontend estático (la página web la sirve este mismo Spring Boot) ──────
# Se prueban las dos rutas para que funcione ejecutando desde backend/ o desde la raíz del proyecto.
app.frontend.path=./frontEnd/,file:../frontEnd/
spring.web.resources.static-locations=file:${app.frontend.path}

# ── Menú / pedidos ─────────────────────────────────────────────────────────
# Ingredientes base, opciones de bebida y adicionales (no existen en la BD). Se puede apuntar a un archivo externo: file:./menu-config.json
app.menu-config=classpath:menu-config.json
app.menu.cache-seconds=15
app.orders.payment-methods=Efectivo,Nequi,Transferencia

# Orígenes permitidos si el frontend se sirve desde otro lado (con el frontend servido por Spring no hace falta).
app.cors.allowed-origins=*
