server.port=80
server.address=0.0.0.0

rmi.host=192.168.1.4
rmi.port=1806
rmi.name=restaurante

# Carpeta del frontend (se prueba en orden): ejecuta desde backend/ o desde la raíz del proyecto.
spring.web.resources.static-locations=file:./frontend/,file:../frontend/,file:./frontEnd/,file:../frontEnd/

app.menu-config=classpath:menu-config.json
app.menu.cache-seconds=15
app.orders.payment-methods=Efectivo,Nequi,Transferencia

app.cors.allowed-origins=*

# Nombre para entrar desde el navegador sin mostrar la IP: http://restaurante.local:8080
# (mDNS/Bonjour: Windows 10+, macOS, iOS y Android reciente lo resuelven solos; no hace falta tocar el router).
app.mdns.enabled=true
app.mdns.name=restaurante
# Si el equipo tiene varias redes (VPN, WSL, Docker) y el nombre apunta a la IP equivocada, fíjala aquí:
app.mdns.address=
